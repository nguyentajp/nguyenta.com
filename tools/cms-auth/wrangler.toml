# Worker đăng nhập cho Decap CMS. Deploy lại sau khi sửa worker.js:
#   npx wrangler@4 deploy --config tools/cms-auth/wrangler.toml
name = "nguyenta-cms-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Client ID của GitHub OAuth App "nguyenta.com CMS" (không bí mật)
GITHUB_CLIENT_ID = ""
ALLOWED_ORIGINS = "https://nguyenta.com"
