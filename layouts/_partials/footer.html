{{- /* Chân trang gọn: các trang phụ, RSS và một dòng về site. Danh mục và lưu
     trữ đã có ở sidebar nên không lặp lại ở đây. */ -}}
<footer class="site-footer">
  <div class="shell footer-inner">
    <nav class="footer-nav" aria-label="{{ .Site.Title }}">
      {{- range .Site.Menus.under }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      {{- with .OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">{{ i18n "footer_rss" }}</a>{{ end }}
    </nav>
    <p class="colophon">{{ i18n "footer_colophon" }}</p>
  </div>
</footer>
