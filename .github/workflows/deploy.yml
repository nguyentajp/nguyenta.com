# ─────────────────────────────────────────────────────────────────────────────
# Build nguyenta.com và đưa lên GitHub Pages.
#
# Chạy khi: có commit mới trên main (kể cả commit từ Decap CMS), mỗi ngày lúc
# 0:05 giờ Nhật, hoặc bấm tay "Run workflow" trong tab Actions.
#
# Thứ tự build giống hệt ở máy:
#   tải font gốc → subset font toàn site → hugo → font cho từng trang
#   → soát HTML (chỉ cảnh báo) → Pagefind
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  # 15:05 UTC = 0:05 giờ Nhật. Build lại mỗi ngày để bài hẹn giờ (ngày đăng
  # trong tương lai) tự hiện khi tới ngày, không cần ai bấm gì.
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

# Quyền tối thiểu: đọc code, ghi lên Pages. id-token để Pages xác minh lần deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Mỗi lúc chỉ một lần deploy. Không huỷ lần đang chạy dở, để site không bao
# giờ bị bỏ lại giữa chừng.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  PAGEFIND_VERSION: 1.5.2
  # Ngày giờ trong bài tính theo giờ Nhật, giống máy của Nguyên
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7
        with:
          # Đủ lịch sử git để Hugo biết ngày sửa cuối của từng bài (enableGitInfo)
          fetch-depth: 0

      - name: Cài Hugo extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Cài Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fonts/requirements.txt

      - name: Cài thư viện font
        run: python -m pip install -r tools/fonts/requirements.txt

      # Font gốc khoảng 25 MB, không có trong repo. Lưu cache theo fonts.lock.json:
      # lock không đổi thì lần sau khỏi tải lại.
      - name: Cache font gốc
        uses: actions/cache@v6
        with:
          path: tools/fonts/src
          key: fonts-${{ hashFiles('tools/fonts/fonts.lock.json') }}

      - name: Tải font gốc (kiểm tra SHA256)
        run: python tools/fonts/get-sources.py

      - name: Subset font cho toàn site
        run: python tools/fonts/build.py --dev

      # Ảnh đã resize (WebP nhiều cỡ) nằm trong resources/_gen. Giữ lại giữa các
      # lần build để khỏi xử lý lại ảnh cũ mỗi khi thêm một bài.
      - name: Cache ảnh đã xử lý
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp', 'assets/**/*.jpg', 'assets/**/*.png') }}
          restore-keys: hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      # Font dùng chung cả site cộng phần chữ Hán riêng của từng bài tiếng Nhật
      - name: Font cho từng trang
        run: python tools/fonts/build.py --pages public

      # Link nội bộ hỏng, id trùng, ảnh thiếu alt, số h1. Chỉ cảnh báo (hiện ở
      # trang tóm tắt của lần chạy), không chặn deploy. Soát bản đầy đủ, vì lúc
      # bảo trì public/ gần như chỉ còn trang ensō.
      - name: Soát HTML
        continue-on-error: true
        env:
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_MAINTENANCE: "false"
        run: |
          hugo --minify --quiet -d "$RUNNER_TEMP/check"
          python tools/check.py "$RUNNER_TEMP/check"

      - name: Lập chỉ mục tìm kiếm
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public

      # CMS chỉ dùng ở máy (xem README mục 2.1), trên mạng /admin không đăng
      # nhập được nên không đưa lên.
      - name: Bỏ trang CMS
        run: rm -rf public/admin

      # ── Bản xem trước riêng (README mục 11.4) ──────────────────────────────
      # Site đầy đủ, không bảo trì, đẩy lên Worker nguyenta-preview có
      # Cloudflare Access chắn trước. Chưa có secret CLOUDFLARE_API_TOKEN thì
      # bỏ qua. Lỗi ở đây không chặn việc deploy nguyenta.com.
      - name: Kiểm tra token Cloudflare
        id: cf
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build bản xem trước
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true
        id: preview_build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_PARAMS_MAINTENANCE: "false"
        run: |
          hugo --minify --baseURL https://nguyenta-preview.genblog.workers.dev/ -d preview-public
          python tools/fonts/build.py --pages preview-public
          npx --yes "pagefind@${PAGEFIND_VERSION}" --site preview-public
          rm -rf preview-public/admin

      - name: Đẩy bản xem trước lên Cloudflare
        if: steps.cf.outputs.ok == 'true' && steps.preview_build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0340bc4b927d2034ec40001b42e97009
        run: npx --yes wrangler@4 deploy --config tools/preview/wrangler.toml

      # Bật params.maintenance trong hugo.toml thì trang nào cũng là trang
      # "đang dựng", nhưng file bài viết, ảnh, RSS, sitemap, chỉ mục tìm kiếm
      # vẫn nằm trong public/. Bước này chỉ giữ lại những gì trang bảo trì và
      # trang "Về blog này" (/ve-blog/, /ja/about-blog/, đường dẫn cũ /concept/)
      # cần, để không ai mở được nội dung bằng cách đoán URL.
      - name: Chế độ bảo trì
        run: |
          if ! grep -q 'data-maintenance' public/index.html; then
            # Bài demo (demo: true trong front matter) chỉ để xem thử giao diện
            # trên bản xem trước, không bao giờ được lên nguyenta.com.
            if demo=$(grep -rl '^demo: true' content); then
              echo "::error::Còn bài demo, xoá trước khi mở blog:"
              echo "$demo"
              exit 1
            fi
            echo "Không bảo trì: đưa lên toàn bộ site."
            exit 0
          fi
          mkdir kept
          for p in index.html ja/index.html 404.html robots.txt favicon.ico \
                   apple-touch-icon.png sw.js css js fonts brand concept ve-blog \
                   ja/about-blog; do
            if [ -e "public/$p" ]; then
              mkdir -p "kept/$(dirname "$p")"
              cp -R "public/$p" "kept/$p"
            fi
          done
          rm -rf public
          mv kept public
          echo "Bảo trì: chỉ đưa lên các file sau"
          find public -type f | sort

      - name: Đóng gói cho GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đưa lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
