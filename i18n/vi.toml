# Về blog này (layouts/about-blog.html)
[blog_colors]
other = "Màu sắc"
[blog_colors_text]
other = "Cả bảng màu lấy từ một rừng tre nhìn qua khung cửa dán giấy kiểu Nhật: giấy, mực, bóng tre. Ban đêm là rừng trúc về đêm, nền xanh rất tối. Ô trái là giao diện sáng, ô phải là giao diện tối."
[blog_sekki]
other = "Màu của tiết khí"
[blog_sekki_text]
other = "Màu nhấn của site không cố định: nó đi theo hai mươi bốn tiết khí, cách người Nhật chia một năm thành hai mươi bốn chặng. Mỗi chặng chừng nửa tháng và có một dấu hiệu riêng của trời đất — mai nở, lá non, sương xuống, tuyết dày — màu nhấn lấy từ chính dấu hiệu đó, rồi sau một năm quay về chỗ cũ. Ô bên trái là màu cho giao diện sáng và giao diện tối."
[sekki_range]
other = "khoảng {{ .D1 }}/{{ .M1 }} – {{ .D2 }}/{{ .M2 }}"
[blog_sekki_today]
other = "hôm nay"
[blog_marks]
other = "Gia huy và con dấu"
[blog_kamon_text]
other = "Gia huy kiểu Nhật (kamon): ba lá bạch quả xanh đậm trong một vòng tre màu mực. Bạch quả là cây của Osaka, nơi blog được viết; vòng tre là bộ rễ nối mọi bài về một gốc."
[blog_hanko_text]
other = "Con dấu chữ Nguyên đóng ở cuối mỗi bài, như người viết thư pháp đóng dấu cuối tác phẩm."

