# ─────────────────────────────────────────────────────────────────────────────
# Cấu hình Decap CMS cho nguyenta.com
# Tài liệu: https://decapcms.org/docs/configuration-options/
#
# Mỗi bài là một thư mục (page bundle): index.md và ảnh của bài nằm chung, ví
# dụ content/vi/posts/duong-ve-nha/index.md + content/vi/posts/duong-ve-nha/anh.jpg.
# Ảnh tải lên trong form bài viết vì vậy vào thẳng thư mục của bài đó.
# ─────────────────────────────────────────────────────────────────────────────

# Giao diện CMS bằng tiếng Việt
locale: vi

backend:
  name: github
  # Đổi nếu Bước 7 đặt tên repo khác
  repo: nguyentajp/nguyenta.com
  branch: main
  # CMS chỉ dùng ở máy (local_backend bên dưới + npx decap-server), nên không
  # cần máy chủ đăng nhập GitHub. Muốn viết trên web thì xem README mục 11.7.
  commit_messages:
    create: "Viết {{collection}}: {{slug}}"
    update: "Sửa {{collection}}: {{slug}}"
    delete: "Xoá {{collection}}: {{slug}}"
    uploadMedia: "Tải lên {{path}}"
    deleteMedia: "Xoá {{path}}"

# Viết bài ở máy, không cần GitHub: mở một terminal chạy
#   npx decap-server
# rồi mở http://localhost:1313/admin/ trong lúc hugo server đang chạy.
# Trên nguyenta.com dòng này không có tác dụng.
local_backend: true

site_url: https://nguyenta.com
display_url: https://nguyenta.com
# Ảnh PNG có sẵn kích thước; file SVG không khai kích thước sẽ bị Decap phóng to hết màn hình
logo_url: /apple-touch-icon.png

# Ảnh dùng chung (cho các trang như Giới thiệu). Ảnh của bài viết thì không
# vào đây mà vào thư mục của bài, xem media_folder trong từng collection.
media_folder: assets/images
public_folder: images

# Tên thư mục bài tạo từ tiêu đề: bỏ dấu, chữ thường, nối bằng gạch ngang.
# "Đường về nhà" → duong-ve-nha. Tên thư mục cũng là đường dẫn URL của bài.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Tắt khung xem trước: khung này dùng CSS của Decap, không giống site thật,
# dễ gây hiểu nhầm. Muốn xem thật thì mở hugo server.
editor:
  preview: false

# GitHub Pages không có "deploy preview" (bản build xem thử cho từng lần lưu),
# nên tắt để Decap không cố tải rồi báo lỗi "Không thể tải xem trước"
show_preview_links: false

collections:
  # ── Bài viết tiếng Việt ──────────────────────────────────────────────────
  - name: bai-viet
    label: "Bài viết · Tiếng Việt"
    label_singular: "bài viết tiếng Việt"
    description: "Bài mới luôn bắt đầu là bản nháp. Nút “Công bố” chỉ là lưu bài; bài hiện lên site khi tắt ô “Bản nháp” rồi Công bố."
    folder: content/vi/posts
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    # Ngày đứng trước, tách khỏi tiêu đề bằng dấu —; danh mục và cờ "đã dịch"
    # (nếu có) nối thêm sau, mỗi thứ một dấu chấm giữa, để đọc lướt là biết.
    summary: "{{date | date('DD/MM/YYYY')}} — {{title}} · {{categories.0}}{{has_ja | ternary(' · 🇯🇵 đã có bản Nhật', '')}}{{draft | ternary(' · bản nháp', '')}}"
    sortable_fields: [date, title]
    view_filters:
      - label: "Bản nháp"
        field: draft
        pattern: true
      - label: "Đã đăng"
        field: draft
        pattern: false
      - label: "Đã có bản tiếng Nhật"
        field: has_ja
        pattern: true
      - label: "Chưa có bản tiếng Nhật"
        field: has_ja
        pattern: false
      - label: "Nhật ký"
        field: categories
        pattern: nhat-ky
      - label: "Sở thích"
        field: categories
        pattern: so-thich
      - label: "Đời sống"
        field: categories
        pattern: doi-song
      - label: "Chuyến đi"
        field: categories
        pattern: chuyen-di
      - label: "Suy nghĩ"
        field: categories
        pattern: suy-nghi
      - label: "Học tập"
        field: categories
        pattern: hoc-tap
    view_groups:
      - label: "Năm"
        field: date
        pattern: '\d{4}'
      - label: "Danh mục"
        field: categories.0
        pattern: '.+'
    fields:
      - label: "Tiêu đề"
        name: title
        widget: string
      - label: "Mã nối bản dịch"
        name: translationKey
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Chỉ chữ thường không dấu, số và gạch ngang."]
        hint: "Để trống — lệnh /dich tự điền đúng khi tạo bản dịch. Chỉ gõ tay khi nối thủ công: lưu bài này trước, xem tên thư mục trong URL (vd. .../bai-viet/duong-ve-nha/ → gõ duong-ve-nha), rồi dán y hệt vào ô cùng tên ở bài tiếng Nhật tương ứng."
      - &date
        label: "Ngày đăng"
        name: date
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        hint: "Chọn giờ trong tương lai để hẹn giờ đăng: bài hiện lên ở lần build đầu tiên sau giờ đó (site tự build lại mỗi ngày lúc 0:05)."
      - &lastmod
        label: "Ngày cập nhật"
        name: updated
        widget: datetime
        required: false
        default: ""
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD/MM/YYYY"
        time_format: "HH:mm"
        hint: "Chỉ điền khi sửa nội dung đáng kể (thêm đoạn, sửa thông tin sai). Dưới tiêu đề bài sẽ hiện “Cập nhật ngày …”. Sửa lỗi chính tả thì để trống."
      - &draft
        label: "Bản nháp"
        name: draft
        widget: boolean
        default: true
        hint: "Bật: bài chỉ nằm trong CMS, chưa hiện trên site. Tắt rồi bấm Công bố: khoảng hai phút sau bài lên site. (Chữ “Đã công bố” ở góc trên chỉ có nghĩa là đã lưu.)"
      - label: "Mô tả ngắn"
        name: description
        widget: text
        required: false
        hint: "Một hai câu. Hiện dưới tiêu đề trong danh sách bài, khi chia sẻ link lên mạng xã hội và trong kết quả tìm kiếm."
      - label: "Danh mục"
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 1
        options:
          - { label: "Nhật ký", value: nhat-ky }
          - { label: "Sở thích", value: so-thich }
          - { label: "Đời sống", value: doi-song }
          - { label: "Chuyến đi", value: chuyen-di }
          - { label: "Suy nghĩ", value: suy-nghi }
          - { label: "Học tập", value: hoc-tap }
      - label: "Đã có bản tiếng Nhật"
        name: has_ja
        widget: boolean
        default: false
        hint: "Bật tay sau khi bài dịch đã đăng ở mục Bài viết · Tiếng Nhật — CMS không tự biết. Dùng để lọc ra bài chưa dịch (Lọc theo → Chưa có bản tiếng Nhật)."
      - label: "Thẻ"
        name: tags
        widget: list
        required: false
        hint: "Viết tự nhiên, có dấu, cách nhau bằng dấu phẩy. Ví dụ: osaka, mùa thu"
      - &cover
        label: "Ảnh bìa"
        name: cover
        widget: image
        required: false
        choose_url: false
        hint: "Hiện trong danh sách bài và khi chia sẻ link. Để trống thì lấy ảnh đầu tiên trong bài. Ảnh bị cắt còn khung ngang 3:2 (chủ thể chính nên nằm giữa ảnh). Khuyên dùng: cạnh dài 1600–2000px, JPG, dưới 2MB."
      - &spotlight
        label: "Bài viết nổi bật"
        name: spotlight
        widget: boolean
        required: false
        default: false
        hint: "Bật thì bài này nằm lớn ở đầu trang chủ. Nhiều bài cùng bật thì bài mới nhất được chọn; không bài nào bật thì đầu trang chủ là bài mới nhất. Bản tiếng Nhật bật riêng cho trang chủ tiếng Nhật."
      - &spotlight_image
        label: "Ảnh bài viết nổi bật"
        name: spotlight_image
        widget: image
        required: false
        choose_url: false
        hint: "Không bắt buộc. Ảnh riêng cho chỗ nổi bật ở đầu trang chủ, nên là ảnh ngang. Để trống thì dùng ảnh bìa. Cũng bị cắt còn 3:2 — cùng khuyên dùng như Ảnh bìa: cạnh dài 1600–2000px, dưới 2MB."
      - &variant
        label: "Kiểu trình bày"
        name: variant
        widget: select
        required: false
        default: "default"
        options:
          - { label: "Mặc định: tiêu đề, ảnh bìa, bài viết", value: "default" }
          - { label: "Sổ học: thêm khung mục lục các phần của bài", value: "study" }
        hint: "Ảnh bìa (nếu có) luôn nằm ngay dưới tiêu đề. Ảnh khác chèn ở đâu trong bài cũng được, bằng nút + → Ảnh."
      - &body
        label: "Nội dung"
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image, gallery, youtube]
        hint: "Dùng nút + để chèn Ảnh, Bộ ảnh hoặc Video YouTube. Ảnh chèn trong bài giữ nguyên tỉ lệ gốc, không bị cắt — khuyên dùng cạnh dài dưới 1800px, dưới 2MB một ảnh. Furigana: viết cách đọc trong ngoặc sát sau chữ Hán, ví dụ 元（げん）, 食（た）べる."

  # ── Bài viết tiếng Nhật ──────────────────────────────────────────────────
  # Thường tạo bằng lệnh /dich trong Claude Code; ở đây để sửa và xuất bản.
  - name: kiji
    label: "Bài viết · Tiếng Nhật"
    label_singular: "bài viết tiếng Nhật"
    description: "Bản dịch tiếng Nhật. Thường tạo bằng lệnh /dich trong Claude Code rồi sửa và xuất bản ở đây."
    folder: content/ja/posts
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    # Tiêu đề tiếng Nhật không bỏ dấu thành chữ Latin được, nên tên thư mục
    # lấy từ ô "Đường dẫn" (romaji) chứ không lấy từ tiêu đề
    slug: "{{fields.slug}}"
    summary: "{{date | date('DD/MM/YYYY')}} — {{title}} · {{categories.0}}{{draft | ternary(' · bản nháp', '')}}"
    sortable_fields: [date, title]
    view_filters:
      - label: "Bản nháp"
        field: draft
        pattern: true
      - label: "Đã đăng"
        field: draft
        pattern: false
      - label: "日記 · Nhật ký"
        field: categories
        pattern: nikki
      - label: "趣味 · Sở thích"
        field: categories
        pattern: shumi
      - label: "暮らし · Đời sống"
        field: categories
        pattern: kurashi
      - label: "旅 · Chuyến đi"
        field: categories
        pattern: tabi
      - label: "思索 · Suy nghĩ"
        field: categories
        pattern: shisaku
      - label: "学び · Học tập"
        field: categories
        pattern: manabi
    view_groups:
      - label: "Năm"
        field: date
        pattern: '\d{4}'
      - label: "Danh mục"
        field: categories.0
        pattern: '.+'
    fields:
      - label: "Tiêu đề (tiếng Nhật)"
        name: title
        widget: string
      - label: "Đường dẫn (romaji)"
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Chỉ chữ thường không dấu, số và gạch ngang. Ví dụ: take-no-ha-ga-naru-heya-de"]
        hint: "Phần cuối của URL: nguyenta.com/ja/kiji/<đường-dẫn>/. Viết romaji, nối bằng gạch ngang."
      - label: "Mã nối bản dịch"
        name: translationKey
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Chỉ chữ thường không dấu, số và gạch ngang — đúng bằng tên thư mục bài tiếng Việt."]
        hint: "Để trống — lệnh /dich tự điền đúng khi tạo bản dịch. Chỉ gõ tay khi nối thủ công: mở bài tiếng Việt tương ứng, chép đúng giá trị ở ô “Mã nối bản dịch” của bài đó (hoặc tên thư mục trong URL nếu ô đó đang trống), dán y hệt vào đây. Hai bản phải giống nhau tuyệt đối thì nút chuyển ngôn ngữ mới nối được."
      - *date
      - *lastmod
      - *draft
      - label: "Mô tả ngắn"
        name: description
        widget: text
        required: false
      - label: "Danh mục"
        name: categories
        widget: select
        multiple: true
        min: 1
        max: 1
        options:
          - { label: "日記 · Nhật ký", value: nikki }
          - { label: "趣味 · Sở thích", value: shumi }
          - { label: "暮らし · Đời sống", value: kurashi }
          - { label: "旅 · Chuyến đi", value: tabi }
          - { label: "思索 · Suy nghĩ", value: shisaku }
          - { label: "学び · Học tập", value: manabi }
      - label: "Thẻ"
        name: tags
        widget: list
        required: false
        hint: "Viết bằng tiếng Nhật, cách nhau bằng dấu phẩy. Tra GLOSSARY.md để dùng đúng thẻ đã có."
      - *cover
      - *spotlight
      - *spotlight_image
      - *variant
      - *body

  # ── Các trang cố định ────────────────────────────────────────────────────
  - name: trang
    label: "Trang"
    label_singular: "trang"
    description: "Các trang không phải bài viết."
    files:
      - name: gioi-thieu
        label: "Giới thiệu · Tiếng Việt"
        file: content/vi/about.md
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - label: "Nội dung"
            name: body
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
      - name: profile
        label: "Giới thiệu · Tiếng Nhật"
        file: content/ja/about.md
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - label: "Nội dung"
            name: body
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
      - name: ve-blog
        label: "Về blog này · Tiếng Việt"
        file: content/vi/blog.md
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - label: "Mô tả ngắn"
            name: description
            widget: text
            required: false
            hint: "Hiện khi chia sẻ link lên mạng xã hội và trong kết quả tìm kiếm."
          - label: "Nội dung"
            name: body
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]
      - name: about-blog
        label: "Về blog này · Tiếng Nhật"
        file: content/ja/blog.md
        fields:
          - { label: "Tiêu đề", name: title, widget: string }
          - label: "Mô tả ngắn"
            name: description
            widget: text
            required: false
            hint: "Hiện khi chia sẻ link lên mạng xã hội và trong kết quả tìm kiếm."
          - label: "Nội dung"
            name: body
            widget: markdown
            modes: [rich_text, raw]
            buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
            editor_components: [image]

  # ── 24 tiết khí ──────────────────────────────────────────────────────────
  # Mục riêng, chỉ để sửa chữ của 24 tiết khí. Sửa xong bấm Công bố là lưu
  # thẳng vào data/sekki_notes.yaml, không cần đụng tới file.
  - name: tiet-khi
    label: "24 tiết khí"
    label_singular: "tiết khí"
    description: "Chữ của 24 tiết khí. Lời giải thích hiện trong khung nhỏ khi rê chuột (điện thoại: chạm) vào tên tiết khí dưới ngày đăng bài; tên màu và câu “vì sao” hiện ở trang Về blog này, mục Màu của tiết khí."
    files:
      - name: tiet-khi
        label: "24 tiết khí"
        file: data/sekki_notes.yaml
        fields:
          - label: "24 tiết khí"
            name: sekki
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            collapsed: true
            summary: "{{fields.ja}}"
            fields:
              - label: "Tên chữ Hán"
                name: ja
                widget: string
                hint: "Không sửa ô này: site dùng nó để biết đoạn giải thích thuộc tiết nào."
              - label: "Giải thích tiếng Việt"
                name: vi_text
                widget: text
              - label: "Tên màu tiếng Việt"
                name: color_vi
                widget: string
              - label: "Vì sao màu này (tiếng Việt)"
                name: why_vi
                widget: text
              - label: "Giải thích tiếng Nhật"
                name: ja_text
                widget: text
              - label: "Tên màu tiếng Nhật"
                name: color_ja
                widget: string
              - label: "Vì sao màu này (tiếng Nhật)"
                name: why_ja
                widget: text
