# ─────────────────────────────────────────────────────────────────────────────
# nguyenta.com — blog cá nhân song ngữ của Gen
#
# Ghi chú cho chủ blog: file này là "bảng điều khiển" của cả site. Mỗi khi sửa
# file này, `hugo server` đang chạy sẽ tự khởi động lại. Các mục quan trọng:
#   - [languages]  : hai ngôn ngữ vi (mặc định) và ja
#   - [permalinks] : quy định đường dẫn URL của từng loại trang, theo ngôn ngữ
#   - [taxonomies] : categories (danh mục, cố định) và tags (thẻ, tự do)
# ─────────────────────────────────────────────────────────────────────────────

baseURL = "https://nguyenta.com/"
title = "Gen"
copyright = "Gen"
timeZone = "Asia/Tokyo"

enableRobotsTXT = true
# Cần cho tiếng Nhật: Hugo đếm chữ theo ký tự thay vì theo khoảng trắng, nên
# thời gian đọc và đoạn tóm tắt của bài tiếng Nhật mới đúng.
hasCJKLanguage = true
# Giữ nguyên chữ hoa chữ thường của thẻ: mặc định Hugo đổi "mùa thu" thành
# "Mùa Thu", nhưng thẻ là chữ anh tự viết nên phải tôn trọng đúng như đã gõ.
titleCaseStyle = "none"
enableEmoji = false

# KHÔNG bật removePathAccents: nó bỏ mọi dấu tổ hợp Unicode, nên chữ Nhật có
# dakuten bị phá (学び -> 学ひ). Danh mục vì thế khai báo slug tường minh trong
# front matter; thẻ thì giữ nguyên chữ có dấu trong URL.
removePathAccents = false

# Bài draft, bài hẹn ngày đăng ở tương lai và bài đã hết hạn không được build.
# Khi chạy thử ở local, dùng `hugo server -D` để xem cả bài draft.
buildDrafts = false
buildFuture = false
buildExpired = false

# ── Song ngữ ─────────────────────────────────────────────────────────────────
# vi là ngôn ngữ mặc định nên URL không có tiền tố: nguyenta.com/
# ja nằm trong thư mục con:                        nguyenta.com/ja/
defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = false

[languages]

  [languages.vi]
    label = "Tiếng Việt"          # tên ngôn ngữ hiển thị cho người đọc
    locale = "vi-VN"           # dùng cho định dạng ngày tháng
    direction = "ltr"
    contentDir = "content/vi"
    title = "Gen"
    weight = 1

    [languages.vi.params]
      description = "Ghi chép của Gen từ Osaka: học tập, đời sống, du lịch, suy nghĩ và nhật ký."
      # Tagline dưới tên blog ở đầu trang và ở chân trang. Là một câu tuyên
      # ngôn ngắn, ứng với câu tiếng Nhật 大阪より、ベトナム人として、自分の旅を綴る。
      tagline = "Từ Osaka, một người Việt chép lại hành trình của mình."
      # Đoạn giới thiệu ngắn trong khung "Về Nguyên" ở sidebar. Anh sửa tuỳ ý.
      bio = "Nguyên, bút danh Gen, sống và làm việc ở Osaka. Nơi đây ghi lại chuyện học tiếng Nhật, đời sống và những chuyến đi, bằng tiếng Việt và tiếng Nhật."
      # Trang 404 dùng chung cho hai ngôn ngữ: trang nào cũng hiện cả hai thứ
      # tiếng, ngôn ngữ đang đọc đứng trước (layouts/404.html)
      notFoundTitle = "Trang này chưa mọc lên"
      notFoundText = "Đường dẫn vừa mở không có gì cả. Có thể bài đã đổi đường dẫn, hoặc chưa được đăng."
      notFoundHome = "Về trang chủ"

    # URL bài viết: lấy "slug" trong front matter; không có slug thì lấy tên
    # thư mục của bài (Decap CMS tự đặt tên thư mục không dấu theo tiêu đề).
    # Không dùng ":slug" trơn: thiếu slug thì Hugo lấy tiêu đề, URL sẽ có dấu.
    [languages.vi.permalinks.page]
      posts = "/bai-viet/:slugorcontentbasename/"
    [languages.vi.permalinks.section]
      posts = "/bai-viet/"
    [languages.vi.permalinks.term]
      categories = "/danh-muc/:slug/"
      tags = "/the/:slug/"
    [languages.vi.permalinks.taxonomy]
      categories = "/danh-muc/"
      tags = "/the/"

    # Menu chính. Mục có "parent" là mục con, hiện trong submenu của mục cha
    # (identifier). Submenu của Danh mục không khai ở đây: masthead.html tự
    # liệt kê các danh mục đang có, thêm danh mục mới là tự hiện.
    [[languages.vi.menus.main]]
      name = "Bài viết"
      pageRef = "/posts"
      weight = 1
    [[languages.vi.menus.main]]
      name = "Danh mục"
      pageRef = "/categories"
      weight = 2
    [[languages.vi.menus.main]]
      name = "Mục lục"
      pageRef = "/archive"
      weight = 3
    [[languages.vi.menus.main]]
      name = "Giới thiệu"
      identifier = "gioi-thieu"
      pageRef = "/about"
      weight = 4
    [[languages.vi.menus.main]]
      name = "Về Nguyên (Gen)"
      parent = "gioi-thieu"
      pageRef = "/about"
      weight = 1
    [[languages.vi.menus.main]]
      name = "Về blog này"
      parent = "gioi-thieu"
      pageRef = "/blog"
      weight = 2

    # Menu nhỏ ở chân trang
    [[languages.vi.menus.under]]
      name = "Thẻ"
      pageRef = "/tags"
      weight = 1
    [[languages.vi.menus.under]]
      name = "Liên hệ"
      pageRef = "/contact"
      weight = 2
    [[languages.vi.menus.under]]
      name = "Nagi"
      pageRef = "/nagi"
      weight = 3

  [languages.ja]
    label = "日本語"          # tên ngôn ngữ hiển thị cho người đọc
    locale = "ja-JP"           # dùng cho định dạng ngày tháng
    direction = "ltr"
    contentDir = "content/ja"
    title = "Gen"
    weight = 2

    [languages.ja.params]
      description = "大阪から、学びと暮らしと旅の記録。Gen の個人ブログです。"
      # キャッチコピーは宣言なので常体（綴る）。記事本文の です・ます とは別の文体。
      tagline = "大阪より、ベトナム人として、自分の旅を綴る。"
      bio = "大阪で暮らし、働いている Gen（元）です。日本語の勉強や暮らし、旅のことを、ベトナム語と日本語で書いています。"
      notFoundTitle = "このページはまだ芽を出していません"
      notFoundText = "お探しのページはありません。URL が変わったか、まだ公開されていないのかもしれません。"
      notFoundHome = "ホームへ"

    [languages.ja.permalinks.page]
      posts = "/kiji/:slugorcontentbasename/"
    [languages.ja.permalinks.section]
      posts = "/kiji/"
    [languages.ja.permalinks.term]
      categories = "/category/:slug/"
      tags = "/tag/:slug/"
    [languages.ja.permalinks.taxonomy]
      categories = "/category/"
      tags = "/tag/"

    [[languages.ja.menus.main]]
      name = "記事"
      pageRef = "/posts"
      weight = 1
    [[languages.ja.menus.main]]
      name = "カテゴリー"
      pageRef = "/categories"
      weight = 2
    [[languages.ja.menus.main]]
      name = "目次"
      pageRef = "/archive"
      weight = 3
    [[languages.ja.menus.main]]
      name = "紹介"
      identifier = "shokai"
      pageRef = "/about"
      weight = 4
    [[languages.ja.menus.main]]
      name = "プロフィール"
      parent = "shokai"
      pageRef = "/about"
      weight = 1
    [[languages.ja.menus.main]]
      name = "このブログについて"
      parent = "shokai"
      pageRef = "/blog"
      weight = 2

    [[languages.ja.menus.under]]
      name = "タグ"
      pageRef = "/tags"
      weight = 1
    [[languages.ja.menus.under]]
      name = "お問い合わせ"
      pageRef = "/contact"
      weight = 2
    [[languages.ja.menus.under]]
      name = "凪"
      pageRef = "/nagi"
      weight = 3

# ── Danh mục và thẻ ──────────────────────────────────────────────────────────
# categories: 6 mục cố định (thứ tự theo weight), là xương sống điều hướng.
# tags: tự do, dùng để liên kết chéo giữa các bài (mục "Bài viết liên quan").
[taxonomies]
  category = "categories"
  tag = "tags"

# ── Phân trang ───────────────────────────────────────────────────────────────
# Số bài mỗi trang ở trang Bài viết, danh mục và thẻ. Để 6 vì mỗi bài trong
# danh sách chiếm khá nhiều chỗ (ảnh nhỏ + ba dòng mở đầu), và vì trang Bài
# viết còn có bài nổi bật đứng trên nữa.
[pagination]
  pagerSize = 6

# ── Markdown ─────────────────────────────────────────────────────────────────
[markup]

  [markup.goldmark.renderer]
    # Không cho phép HTML thô trong file Markdown: mọi thứ đặc biệt đi qua
    # shortcode, nhờ vậy nội dung viết từ Decap CMS không thể làm hỏng layout.
    unsafe = false

  [markup.goldmark.parser]
    # Ảnh đứng một mình không bị bọc trong <p>, để dùng <figure> cho tử tế.
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
      title = true

  [markup.goldmark.extensions.typographer]
    # Tắt: việc tự đổi dấu nháy và dấu gạch không hợp cho tiếng Việt lẫn tiếng Nhật.
    disable = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2

# ── Xử lý ảnh ────────────────────────────────────────────────────────────────
# Hugo đọc ảnh gốc trong page bundle rồi tự sinh nhiều kích thước và WebP.
# Ảnh sinh ra được mã hóa lại, nên mọi EXIF (gồm cả toạ độ GPS) đều bị bỏ.
[imaging]
  resampleFilter = "Lanczos"

  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82
    hint = "photo"

  [imaging.exif]
    disableDate = false
    disableLatLong = true

# ── Quyền riêng tư của người đọc ─────────────────────────────────────────────
[privacy]
  [privacy.youtube]
    privacyEnhanced = true

# ── Output ───────────────────────────────────────────────────────────────────
# RSS riêng cho từng ngôn ngữ do Hugo tự sinh: / index.xml và /ja/index.xml
[outputs]
  home = ["html", "rss"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

[services]
  [services.rss]
    limit = 20

# ── Thông số dùng chung cho cả hai ngôn ngữ ──────────────────────────────────
[params]
  # Chế độ bảo trì: true thì nguyenta.com chỉ hiện một trang "đang dựng" (vòng
  # ensō của trang 凪), mọi bài viết, RSS, sitemap và chỉ mục tìm kiếm đều
  # không được đưa lên. Chỉ có tác dụng khi build thật (GitHub Actions);
  # `hugo server` ở máy vẫn hiện site đầy đủ. Mở blog: đổi thành false, commit.
  maintenance = true
  author = "Gen"
  authorKanji = "英元"
  email = "info@nguyenta.com"
  # Số bài hiện trên trang chủ, không tính bài mới nhất đã hiện đầy đủ
  homeRecentCount = 4
  # Số bài tối đa trong hàng "Bài viết liên quan" (chung thẻ hoặc danh mục) ở
  # cuối mỗi bài. Hàng hiện khoảng ba bài một lượt, nhiều hơn thì cuộn ngang.
  relatedCount = 6

  # Bản tin ở chân trang. Để trống "id" thì khối chỉ là giao diện mẫu, bấm Đăng
  # ký ra dòng "chưa mở" (site.js mục 8). Điền id vào là form gửi thật: nó POST
  # thẳng sang nhà cung cấp, không có API key nào nằm trong repo và không cần
  # JS. Nhà cung cấp gửi thư xác nhận, người đọc bấm vào thư mới thành người
  # đăng ký (double opt-in).
  #
  # Đường dẫn form là: action + id + suffix. Mỗi nhà một kiểu, nên cả ba thứ
  # đều ghi ở đây, không chôn trong layout:
  #
  #   Kit (kit.com, trước là ConvertKit) — đang dùng, free tới 10.000 người:
  #     id     = số form, lấy trong URL lúc sửa form trên Kit
  #     action = "https://app.kit.com/forms/"
  #     suffix = "/subscriptions"
  #     field  = "email_address"
  #
  #   Buttondown — free tới 100 người:
  #     id     = username Buttondown
  #     action = "https://buttondown.com/api/emails/embed-subscribe/"
  #     suffix = ""
  #     field  = "email"
  #
  # Form Kit đang dùng: "nguyenta.com", bật sẵn thư xác nhận (double opt-in).
  [params.newsletter]
    id = "9940557"
    action = "https://app.kit.com/forms/"
    suffix = "/subscriptions"
    field = "email_address"

  [params.socials]
    # Để trống nghĩa là không hiện. Điền dần khi anh muốn.
    # Facebook ghi cả đường dẫn; hiện ở chân trang và trang Liên hệ.
    facebook = "https://www.facebook.com/nguyentajp/"
    github = ""
    instagram = "nguyenta1403"
    x = ""
    youtube = ""

# ── Bài viết liên quan: Hugo dùng thẻ chung để tìm ─────────────────────────
[related]
  includeNewer = true
  threshold = 60
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 40
  [[related.indices]]
    name = "date"
    weight = 10
