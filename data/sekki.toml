# 二十四節気 — dữ liệu cho nhãn tiết khí dưới ngày đăng của mỗi bài.
#
# Layout so ngày đăng với các mốc dưới đây và lấy tiết khí gần nhất trước đó.
# Ngày bắt đầu mỗi tiết xê dịch một ngày tuỳ năm; sai số đó không ảnh hưởng
# tới ý nghĩa của nhãn. Bảng người đọc được nằm trong GLOSSARY.md.
#
# accent_light / accent_dark là màu nhấn của site trong tiết đó (--accent trong
# main.css, chèn ở _partials/sekki-accent.html). ĐỪNG sửa tay hai mã màu này:
# chúng do tools/sekki_colors.py sinh ra, ở đó có sắc và độ tươi của từng tiết
# cùng phần kiểm tương phản. Muốn đổi màu thì sửa bảng trong tool rồi chạy
#   ./.venv/bin/python tools/sekki_colors.py --toml
# và dán lại. Chạy không có --toml thì ra bảng kiểm tương phản.
#
# File này chỉ giữ ngày và màu. Mọi chữ của 24 tiết (lời giải thích, tên màu,
# câu "vì sao màu này") nằm chung ở data/sekki_notes.yaml.

