# Bảng màu hiện ở trang "Về blog này" (layouts/about-blog.html).
# Trang tiếng Việt hiện vi_name (kèm romaji), trang tiếng Nhật hiện chữ Hán.
# Mã màu phải khớp token ở đầu assets/css/main.css (light / dark); sửa token
# ở đó thì nhớ sửa ở đây. vi và ja là một câu mô tả vai trò của màu.
#
# Màu nhấn thật của site KHÔNG nằm ở đây: nó đổi theo tiết khí, xem
# data/sekki.toml và tools/sekki_colors.py. 銀杏 chỉ còn là màu dự phòng.

[[colors]]
  ja = "障子"
  romaji = "Shōji"
  vi_name = "Giấy cửa"
  light = "#f6f7f2"
  dark = "#171915"
  vi = "Nền. Ánh sáng lọt qua giấy dán cửa, hơi ngả xanh vì bóng tre."
  ja_role = "地の色。障子越しの光で、竹の影がほんのり緑を落としています。"

[[colors]]
