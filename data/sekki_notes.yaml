# Toàn bộ chữ của 24 tiết khí, gom một chỗ để sửa một lượt. Sửa trong CMS →
# Dữ liệu → 24 tiết khí, hoặc sửa tay file này.
#
#   vi_text / ja_text   lời giải thích, hiện trong khung nhỏ khi rê chuột
#                       (điện thoại: chạm) vào tên tiết khí dưới ngày đăng bài
#   color_vi / color_ja tên màu nhấn của tiết đó
#   why_vi / why_ja     một câu nói vì sao tiết này mang màu đó
#
# Tên màu và câu "vì sao" hiện ở trang Về blog này, mục "Màu của tiết khí".
# Trang tiếng Việt chỉ dùng bản _vi, trang tiếng Nhật chỉ dùng bản _ja.
#
# Trường "ja" là tên chữ Hán, dùng để nối với ngày và mã màu trong
# data/sekki.toml: không sửa trường này.
sekki:
  - ja: 立春
    vi_text: "Ngày đầu xuân theo lịch cổ, ngay sau Setsubun, ngày cuối cùng của mùa đông. Trời còn rét, nhưng nắng đã dài hơn và hoa mơ bắt đầu nở."
    color_vi: "Hồng hoa mơ đỏ"
    why_vi: "Mơ nở giữa cái rét cuối đông nên người Nhật gọi là “hoa báo xuân”: sắc hồng ấy là tin xuân đầu tiên."
    ja_text: "暦の上で春が始まる日。前日の節分は、冬の最後の日にあたります。寒さはなお厳しいものの、梅がほころび始めます。"
    color_ja: "紅梅色"
    why_ja: "梅は春告草とも呼ばれます。寒さのなかにほころぶ紅が、春の最初の知らせです。"
  - ja: 雨水
    vi_text: "Tuyết chuyển thành mưa, băng tuyết tan thành nước; xưa là mốc để lo việc đồng áng. Nhiều nhà ở Nhật bắt đầu bày búp bê Hina từ quãng này, sẵn cho lễ 3/3."
    color_vi: "Tím xám sương giăng"
    why_vi: "Tuyết hóa mưa, xa xa bắt đầu có sương giăng: một sắc tím xám, ẩm, thoáng ánh hồng."
    ja_text: "雪が雨に変わり、積もった雪や氷が解けて水になるころ。農作業の準備を始める目安とされ、雛人形を出し始める家もあります。"
    color_ja: "霞の藤鼠"
    why_ja: "雪が雨に変わるころ、遠くに霞がかかり始めます。藤色を含んだ、湿った鼠色です。"
  - ja: 啓蟄
    vi_text: "Sâu bọ ngủ đông dưới đất chui lên đón hơi ấm. Người Nhật viết chữ “khải” (mở), không phải “kinh” (giật mình) như cách gọi quen thuộc ở Việt Nam: đất như mở cửa cho chúng."
    color_vi: "Hồng hoa đào"
    why_vi: "Đào hé nở ít ngày sau lễ búp bê 3/3, vốn được gọi là lễ hội hoa đào; sâu bọ vừa thức thì cây cũng thức."
    ja_text: "冬ごもりしていた虫が、土の中から出てくるころ。「啓」は開く、「蟄」は土の中にこもる虫のことです。このころ鳴る春の雷を「虫出しの雷」と呼びます。"
    color_ja: "桃色"
    why_ja: "桃の節句から数日、桃の枝先がほころび始めます。目覚めるのは虫だけではありません。"
  - ja: 春分
    vi_text: "Ngày và đêm dài gần bằng nhau. Ở Nhật là ngày nghỉ lễ, đúng giữa tuần lễ viếng mộ tổ tiên mùa xuân, gọi là Ohigan."
    color_vi: "Hồng xám hoa anh đào"
    why_vi: "Ngày dài bằng đêm, cũng là lúc anh đào sắp nở. Hồng nhạt đến mức nhìn từ xa chỉ thấy một vầng sáng."
    ja_text: "昼と夜の長さがほぼ等しくなる日。国民の祝日で、「自然をたたえ、生物をいつくしむ」日とされ、春のお彼岸の中日にあたります。"
    color_ja: "桜鼠"
    why_ja: "昼と夜が等しくなるころ、桜がほころび始めます。遠くから見ると、ほのかな明かりのような淡さです。"
  - ja: 清明
    vi_text: "Trời trong, cây cỏ tươi sáng, hoa anh đào nở rộ. Ở Việt Nam, và cả ở Okinawa, đây là dịp ra mộ tảo dọn cùng cả họ."
    color_vi: "Xanh mầm non"
    why_vi: "Anh đào đang rộ, dưới gốc cỏ đã lên xanh. Xanh nhạt và trong, chưa dày như lá mùa hè."
    ja_text: "「清浄明潔」を略した言葉で、万物が清らかで生き生きとするころ。桜が見ごろを迎えます。沖縄では、親族が墓前に集う清明祭（シーミー）の季節です。"
    color_ja: "萌黄"
    why_ja: "桜の盛りのころ、足もとでは草が萌え出します。夏の葉のような厚みはまだなく、淡く澄んだ黄緑です。"
  - ja: 穀雨
    vi_text: "Mưa xuân thấm đất, nuôi hạt giống vừa gieo. Tiết cuối cùng của mùa xuân; chẳng bao lâu sau là ngày thứ 88 kể từ Lập xuân, ngày người Nhật bắt đầu hái lứa trà đầu."
    color_vi: "Xanh đồi chè"
    why_vi: "Mưa xuân tưới đồi chè, chồi mới lên xanh theo từng luống. Người Nhật lẫn người Việt đều quý lứa trà đầu vụ."
    ja_text: "穀物を潤す春の雨が降るころ。春の最後の節気で、種まきの目安とされてきました。このあと八十八夜（五月二日ごろ）に、茶摘みが盛りを迎えます。"
    color_ja: "茶畑の緑"
    why_ja: "春の雨が茶畑を潤し、新芽が畝ごとに伸びます。日本でもベトナムでも、一番茶はとくに尊ばれます。"
  - ja: 立夏
    vi_text: "Ngày đầu hè theo lịch cổ. Lá non xanh mướt, gió mát, là một trong những quãng dễ chịu nhất của năm. Nhiều năm cũng trùng lễ 5/5, ngày treo cờ cá chép."
    color_vi: "Đỏ cờ cá chép"
    why_vi: "Mùng năm tháng Năm, cờ cá chép đỏ lượn trên nóc nhà. Cá chép hóa rồng: chuyện cả hai nước đều biết."
    ja_text: "暦の上で夏が始まる日。新緑がまぶしく、風のさわやかな、もっとも過ごしやすい季節のひとつです。端午の節句と重なる年も多くあります。"
    color_ja: "緋鯉の緋"
    why_ja: "五月五日、緋鯉が空を泳ぎます。滝をのぼった鯉が龍になる話は、日本でもベトナムでも語り継がれてきました。"
  - ja: 小満
    vi_text: "Cây cỏ lớn dần, muôn vật đầy đặn dần. Lúa mạch gieo từ mùa thu bắt đầu chín; người Nhật gọi mùa gặt này là “mùa thu của lúa mạch”."
    color_vi: "Vàng rơm lúa mạch"
    why_vi: "Lúa mạch gieo từ thu nay chín rộ. Mới đầu hè mà người Nhật đã gọi là “mùa thu” của lúa mạch: mugi no aki."
    ja_text: "草木が育ち、天地に生気が満ち始めるころ。秋にまいた麦が実り、穂が黄金色に色づきます。"
    color_ja: "麦藁色"
    why_ja: "夏の入り口でありながら、このころの麦の実りを「麦秋」と呼びます。"
  - ja: 芒種
    vi_text: "Mùa gieo cấy lúa, thứ ngũ cốc có râu. Ở Nhật, mùa mưa đầu hè, tsuyu, bắt đầu vào khoảng này."
    color_vi: "Vàng mơ chín"
    why_vi: "Mùa mưa Nhật có tên “mưa mơ”, chắc vì đúng lúc mơ chín vàng; gian bếp thơm mùi mơ ngâm."
    ja_text: "稲や麦など、穂先に芒（のぎ）のある穀物の種をまくころ。田植えが始まり、梅雨入りもこのころです。"
    color_ja: "梅の実の黄"
    why_ja: "梅雨の名は、梅の実が熟すころの雨に由来するとも。六月の台所は梅仕事の香りに満ちます。"
  - ja: 夏至
    vi_text: "Ngày dài nhất, đêm ngắn nhất trong năm. Ở phần lớn nước Nhật lúc này đang giữa mùa mưa, nên ít khi thấy được nắng dài."
    color_vi: "Cam ráng chiều"
    why_vi: "Ngày dài nhất năm. Giữa mùa mưa, nhưng hôm nào tạnh thì ráng chiều còn nấn ná sau bảy giờ tối."
    ja_text: "一年でもっとも昼が長く、夜が短い日。ただ、日本の大半は梅雨のさなかで、長い日差しを感じにくい時期です。"
    color_ja: "夕焼けの橙"
    why_ja: "夕焼けは夏の季語です。梅雨の合間に晴れれば、七時を過ぎても空に赤みが残ります。"
  - ja: 小暑
    vi_text: "Cái nóng bắt đầu. Mùa mưa sắp dứt, ve bắt đầu kêu. Lễ Tanabata 7/7 gần như trùng ngày này, và người Nhật bắt đầu gửi thiệp hỏi thăm mùa hè từ đây."
    color_vi: "Đỏ tía tô"
    why_vi: "Nóng bắt đầu gắt, tía tô đỏ trong vườn thẫm lại, chờ được muối cùng mơ. Loại rau quen trên mâm cơm cả hai nước."
    ja_text: "本格的な暑さが始まるころ。梅雨明けが近づき、蝉が鳴き始めます。七夕とほぼ重なり、暑中見舞いを出すのもこのころからです。"
    color_ja: "赤紫蘇の紅"
    why_ja: "赤紫蘇が色濃くなり、梅とともに漬け込まれるころ。日本でもベトナムでも食卓になじみの葉です。"
  - ja: 大暑
    vi_text: "Nóng nhất trong năm. Người Nhật có tục ăn lươn vào một ngày giữa hè để lấy sức."
    color_vi: "Cam đỏ trời lửa"
    why_vi: "Nóng nhất năm. Người Nhật gọi bầu trời giữa trưa mùa hè là “trời lửa”, enten: mặt đường hầm hập, ve kêu inh."
    ja_text: "一年でもっとも暑さが厳しいころ。夏の土用の丑の日に、鰻を食べて精をつける習わしがあります。"
    color_ja: "炎天の朱"
    why_ja: "「炎天」は夏の季語。その字のとおり、空そのものが燃えているようなころです。"
  - ja: 立秋
    vi_text: "Ngày đầu thu theo lịch cổ, dù trời còn nóng gắt. Từ hôm nay, thiệp hỏi thăm mùa hè đổi thành thiệp hỏi thăm cái nóng còn sót lại. Chừng một tuần nữa là Obon."
    color_vi: "Vàng cam đèn hoa đăng"
    why_vi: "Obon và Vu Lan cùng một gốc, đều tưởng nhớ người đã khuất. Ở Nhật, đèn hoa đăng thả xuống sông để tiễn họ."
    ja_text: "暦の上で秋が始まる日。実際には暑さの盛りですが、この日から挨拶状は「残暑見舞い」に変わります。まもなくお盆を迎えます。"
    color_ja: "灯籠の飴色"
    why_ja: "お盆とベトナムのヴーラン（盂蘭盆）は同じ源。ともに亡き人を偲び、日本では灯籠を川に流して送ります。"
  - ja: 処暑
    vi_text: "Cái nóng bắt đầu dịu. Chữ “xử” ở đây nghĩa là dừng lại: nóng đến đây là thôi, dù ngoài đường vẫn còn oi. Cũng là mùa bão."
    color_vi: "Vàng lúa ngả màu"
    why_vi: "Hạt lúa vào chắc, bông ngả dần sang vàng. Màu quen thuộc ở đồng bằng cả hai nước."
    ja_text: "暑さがようやく収まり始めるころ。「処」はとどまる、おさまるという意味です。残暑は続きますが、台風の多い時期でもあります。"
    color_ja: "稲穂の黄"
    why_ja: "穂が実って垂れ、田が少しずつ黄金色に染まります。日本でもベトナムでも見慣れた景色です。"
  - ja: 白露
    vi_text: "Sáng sớm có sương đọng trắng trên cỏ. Không khí đã mang hơi thu."
    color_vi: "Nâu bạc cỏ lau"
    why_vi: "Sương sớm đọng trắng trên cỏ. Bông lau trổ rồi, mang một màu nâu bạc, gần như đã nhạt hết sắc."
    ja_text: "朝晩の冷え込みで、草花に白い露が宿り始めるころ。秋の気配が深まります。"
    color_ja: "芒の白茶"
    why_ja: "朝露が草に白く宿るころ、芒が穂を出します。色を失いかけた白茶色です。"
  - ja: 秋分
    vi_text: "Ngày và đêm lại dài bằng nhau; từ đây đêm dài dần. Ở Nhật là ngày nghỉ lễ, giữa tuần lễ viếng mộ tổ tiên mùa thu, gọi là Ohigan."
    color_vi: "Đỏ thắm hoa bỉ ngạn"
    why_vi: "Ohigan chính là “bỉ ngạn”, bờ bên kia. Hoa bỉ ngạn đỏ nở dọc bờ ruộng đúng tuần ấy, hiếm khi lệch một ngày."
    ja_text: "昼と夜の長さがほぼ等しくなる日。この日を境に夜が長くなっていきます。「祖先をうやまい、亡くなった人をしのぶ」祝日で、秋のお彼岸の中日です。"
    color_ja: "彼岸花の真紅"
    why_ja: "彼岸の名をもつ花が、畦道を赤く縁取ります。毎年この数日を違えることは、ほとんどありません。"
  - ja: 寒露
    vi_text: "Sương đêm đã lạnh. Trời thu cao và trong, những ngày nắng ráo nối nhau; hồng chín đỏ trên cành."
    color_vi: "Đỏ cam quả hồng"
    why_vi: "Hồng chín đỏ cam giữa trời thu trong. Câu thơ “ăn hồng, chuông chùa Horyuji ngân” của Shiki viết ở Nara mùa thu."
    ja_text: "露が冷たく感じられるころ。空気が澄み、秋晴れの日が続きます。柿の実が色づき、稲刈りも終わりに近づきます。"
    color_ja: "柿色"
    why_ja: "柿が色づくころ。子規が「柿くへば鐘が鳴るなり法隆寺」と詠んだのも、秋の奈良でした。"
  - ja: 霜降
    vi_text: "Sương muối bắt đầu xuống. Trên núi, lá phong đổi màu đẹp nhất."
    color_vi: "Đỏ lá phong"
    why_vi: "Sương bắt đầu thành giá. Trên núi, lá phong đỏ rực lên một đợt rồi rụng hết."
    ja_text: "霜が降り始めるころ。山々では紅葉が見ごろを迎えます。"
    color_ja: "紅葉の紅"
    why_ja: "露が霜に変わるころ。山では楓がひとしきり赤く燃えて、散ってゆきます。"
  - ja: 立冬
    vi_text: "Ngày đầu đông theo lịch cổ. Gió lạnh đầu mùa thổi, kogarashi, nghĩa là “gió làm khô cây”, lá rụng dần."
    color_vi: "Xám chì gió bấc"
    why_vi: "Cơn gió lạnh đầu mùa vét nốt lá trên cành. Trời tối sớm, ngả sang màu xám xanh như chì."
    ja_text: "暦の上で冬が始まる日。木枯らしが吹き、木々の葉が落ち始めます。"
    color_ja: "木枯らしの鉛色"
    why_ja: "最初の冷たい風が、残った葉を落としてゆきます。日暮れが早まり、空は青みを帯びた鉛色になります。"
  - ja: 小雪
    vi_text: "Tuyết nhẹ bắt đầu rơi ở vùng núi và miền bắc. Trong phố, hàng bạch quả vàng rực."
    color_vi: "Xám mây tuyết"
    why_vi: "Tuyết mới lác đác trên núi, chưa kịp đọng. Dưới mây phủ, tuyết ngả xám lạnh, gần như không còn sắc."
    ja_text: "北国や山では、わずかに雪が降り始めるころ。街では銀杏並木が色づきます。"
    color_ja: "雪雲の鼠"
    why_ja: "山にわずかな雪が舞い、まだ積もりません。雪雲の下では、雪も色を失った冷たい鼠色に見えます。"
  - ja: 大雪
    vi_text: "Núi phủ tuyết dày, và những vùng bên biển Nhật Bản cũng bắt đầu có tuyết. Mùa đông thật sự đến."
    color_vi: "Xanh chàm bóng tuyết"
    why_vi: "Tuyết xuống dày. Màu này lấy từ bóng đổ trên mặt tuyết — nhìn kỹ thì bóng ấy xanh chứ không xám."
    ja_text: "山々が雪に覆われ、日本海側の平地でも雪が降り始めるころ。本格的な冬の到来で、寒ぶりが旬を迎えます。"
    color_ja: "雪の影の藍"
    why_ja: "雪が積もるころ。雪の上に落ちた影は、よく見ると灰色ではなく青く沈んでいます。"
  - ja: 冬至
    vi_text: "Ngày ngắn nhất trong năm. Người Nhật tắm nước thả quả yuzu và ăn bí đỏ để cầu một mùa đông khoẻ mạnh; từ hôm sau, ngày dài dần trở lại."
    color_vi: "Tím than ngân hà"
    why_vi: "Đêm dài nhất năm cho nhiều giờ tối nhất để ngắm sao. Màu lấy từ nền trời quanh ngân hà mùa đông."
    ja_text: "一年でもっとも昼が短い日。柚子湯に入り、かぼちゃを食べて、無病息災を願います。この日を境に日が伸びるため「一陽来復」とも呼ばれます。"
    color_ja: "冬銀河の紫紺"
    why_ja: "一年でもっとも夜が長い日は、星を仰ぐ時間もいちばん長くなります。冬の銀河がかかる、黒に至らない紫紺から。"
  - ja: 小寒
    vi_text: "Bước vào những ngày lạnh nhất trong năm. Người Nhật gửi thiệp hỏi thăm giữa mùa lạnh từ đây."
    color_vi: "Xanh băng"
    why_vi: "Bước vào quãng lạnh nhất. Chậu nước để ngoài trời có những sáng đóng băng, trong và ngả xanh."
    ja_text: "寒さが本格的になる「寒の入り」。この日から節分までを「寒の内」といい、寒中見舞いを出す時期です。"
    color_ja: "氷色"
    why_ja: "寒の入り。外に置いた水が凍る朝も増え、氷は澄んだ青みを帯びます。"
  - ja: 大寒
    vi_text: "Lạnh nhất trong năm. Nước lúc này được cho là khó hỏng, nên người ta dùng để ủ tương miso và nấu rượu."
    color_vi: "Xanh trời rét cóng"
    why_vi: "Lạnh nhất năm. Phía Thái Bình Dương, hôm rét nhất thường trong nhất: xanh cứng, không gợn mây."
    ja_text: "一年でもっとも寒さが厳しいころ。寒の水は腐りにくいとされ、味噌や酒の仕込みに使われてきました。"
    color_ja: "凍空の青"
    why_ja: "一年でもっとも寒いころ。太平洋側では、いちばん冷える朝の空は雲ひとつない硬い青です。"
