# Toàn bộ chữ của 24 tiết khí, gom một chỗ để sửa một lượt. Sửa trong CMS →
# Dữ liệu → 24 tiết khí, hoặc sửa tay file này.
#
#   vi_text / ja_text   lời giải thích, hiện trong khung nhỏ khi rê chuột
#                       (điện thoại: chạm) vào tên tiết khí dưới ngày đăng bài
#   color_vi / color_ja tên màu nhấn của tiết đó
#   why_vi / why_ja     một câu nói vì sao tiết này mang màu đó
#
# Tên màu và câu "vì sao" hiện ở trang Về blog này, mục "Màu của tiết khí".
# Trang tiếng Việt chỉ dùng bản _vi, trang tiếng Nhật chỉ dùng bản _ja.
#
# Trường "ja" là tên chữ Hán, dùng để nối với ngày và mã màu trong
# data/sekki.toml: không sửa trường này.
sekki:
  - ja: 立春
    vi_text: "Ngày bắt đầu mùa xuân theo lịch cũ. Trời còn lạnh, nhưng nắng đã dài hơn và hoa mơ bắt đầu nở."
    color_vi: "Hồng ráng sớm"
    why_vi: "Rét vẫn còn, nhưng ngày đã dài ra; ráng sớm hồng nhạt báo một năm mới bắt đầu."
    ja_text: "暦の上で春が始まる日。寒さはまだ厳しいものの、日差しが少しずつ明るくなり、梅がほころび始めます。"
    color_ja: "朝焼けの紅"
    why_ja: "寒さは残っていますが、夜明けが少しずつ早まり、淡い紅の朝焼けが一年の始まりを告げます。"
  - ja: 雨水
    vi_text: "Tuyết chuyển thành mưa, băng tuyết tan thành nước. Xưa kia là mốc để bắt đầu chuẩn bị việc đồng áng."
    color_vi: "Xanh xám của sương"
    why_vi: "Tuyết tan thành mưa; chân trời lúc nào cũng có một dải mù giăng ngang, màu nhạt và ẩm."
    ja_text: "雪が雨に変わり、積もった雪や氷が解けて水になるころ。農作業の準備を始める目安とされてきました。"
    color_ja: "霞の青鼠"
    why_ja: "雪が雨に変わり、遠くにいつも靄がかかっています。"
  - ja: 啓蟄
    vi_text: "Sâu bọ ngủ đông dưới đất tỉnh dậy, chui lên đón hơi ấm. Kinh trập nghĩa là sâu bọ đang ngủ đông giật mình thức giấc."
    color_vi: "Đỏ cánh bọ rùa"
    why_vi: "Sâu bọ dưới đất thức dậy, bọ rùa bò ra trước tiên, phơi cánh đỏ dưới nắng non."
    ja_text: "冬ごもりしていた虫たちが、土の中から這い出てくるころ。「啓」は開くという意味、「蟄」は土の中で冬を越す虫のことです。"
    color_ja: "天道虫の紅"
    why_ja: "土の中の虫たちが目覚め、天道虫が真っ先に這い出して、赤い羽を陽にきらめかせます。"
  - ja: 春分
    vi_text: "Ngày và đêm dài gần bằng nhau. Ở Nhật là ngày nghỉ lễ, rơi vào giữa tuần lễ viếng mộ tổ tiên mùa xuân."
    color_vi: "Hồng chạng vạng"
    why_vi: "Ngày dài bằng đêm; ngay lúc giao mùa ấy, trời cũng ngập ngừng giữa sáng và tối, nhuộm một sắc hồng mờ."
    ja_text: "昼と夜の長さがほぼ等しくなる日。国民の祝日で、春のお彼岸の中日にあたります。"
    color_ja: "黄昏の紅"
    why_ja: "昼と夜が等しくなるように、空もこの時だけ、昼と夜のあいだで淡い紅にたゆたいます。"
  - ja: 清明
    vi_text: "Trời trong, cây cỏ tươi sáng, hoa anh đào nở rộ. Ở Việt Nam là dịp tảo mộ."
    color_vi: "Xanh lá non"
    why_vi: "Trời quang, cây đâm lá mới. Xanh còn nhạt và trong, chưa dày như lá mùa hè."
    ja_text: "「清浄明潔」を略した言葉で、万物が清らかで生き生きとするころ。桜が見ごろを迎えます。"
    color_ja: "若葉の緑"
    why_ja: "空が澄み、新しい葉の淡い緑が出そろいます。"
  - ja: 穀雨
    vi_text: "Mưa xuân thấm đất, nuôi hạt giống vừa gieo. Tiết cuối cùng của mùa xuân."
    color_vi: "Đỏ cá chép"
    why_vi: "Mưa xuống đầy ao hồ, cá chép tung tăng bơi ngược dòng — hình ảnh quen thuộc trong cả văn hoá Việt lẫn Nhật."
    ja_text: "穀物を潤す春の雨が降るころ。春の最後の節気で、種まきの目安とされてきました。"
    color_ja: "緋鯉の紅"
    why_ja: "雨で池や川が満ち、鯉が勢いよく泳ぎます。日本でもベトナムでも、昔から親しまれてきた魚です。"
  - ja: 立夏
    vi_text: "Ngày bắt đầu mùa hè theo lịch cũ. Lá non xanh, gió nhẹ, là tiết trời dễ chịu nhất trong năm."
    color_vi: "Xanh tre mới"
    why_vi: "Vào hè, măng đã thành cây; thân tre xanh tươi, chưa ngả vàng như tre già."
    ja_text: "暦の上で夏が始まる日。新緑がまぶしく、さわやかな風が吹く、一年でいちばん過ごしやすいころ。"
    color_ja: "新竹の緑"
    why_ja: "夏に入り、筍が竹になって、幹がまだ黄ばまない緑です。"
  - ja: 小満
    vi_text: "Cây cỏ lớn dần, muôn vật dần đầy đặn. Lúa mạch gieo từ mùa thu bắt đầu chín."
    color_vi: "Vàng kén tằm"
    why_vi: "Tằm ăn lá dâu no tròn rồi bắt đầu nhả tơ; kén vàng óng lên, nghề nuôi tằm dệt lụa vốn chung cả hai nước."
    ja_text: "草木が育ち、天地に生気が少しずつ満ちてくるころ。秋にまいた麦の穂が実り始めます。"
    color_ja: "繭の黄金"
    why_ja: "蚕が桑の葉をたっぷり食べ、糸を吐き始めるころ。黄金の繭は、日本でもベトナムでも受け継がれてきた養蚕の景色です。"
  - ja: 芒種
    vi_text: "Mùa gieo các loại hạt có râu như lúa. Ở Nhật, mùa mưa đầu hè bắt đầu vào khoảng này."
    color_vi: "Xanh mạ non"
    why_vi: "Mùa cấy bắt đầu, mạ non xanh mướt được cắm xuống ruộng — cây lúa là gốc rễ chung của cả hai nền văn hoá."
    ja_text: "稲や麦など、穂先に芒（のぎ）のある穀物の種をまくころ。梅雨入りもこのころです。"
    color_ja: "早苗の緑"
    why_ja: "田植えが始まり、青々とした早苗が水田に植えられます。稲は日本とベトナム、どちらの暮らしにも根づいてきました。"
  - ja: 夏至
    vi_text: "Ngày dài nhất, đêm ngắn nhất trong năm. Ở Nhật lúc này đang giữa mùa mưa, nên ít khi thấy được nắng dài."
    color_vi: "Tím núi xa"
    why_vi: "Ngày dài nhất năm, nắng chiều kéo dài trên dãy núi xa, nhuộm chúng thành một dải tím mờ."
    ja_text: "一年でもっとも昼が長く、夜が短い日。ただ日本では梅雨のさなかで、長い日差しを感じにくい時期です。"
    color_ja: "遠山の紫"
    why_ja: "一年でもっとも昼が長く、夕方の光がいつまでも山並みにとどまり、遠くの峰々を淡い紫に染めます。"
  - ja: 小暑
    vi_text: "Cái nóng bắt đầu. Mùa mưa sắp dứt, ve bắt đầu kêu. Người Nhật bắt đầu gửi thiệp hỏi thăm mùa hè từ đây."
    color_vi: "Đỏ tía tô"
    why_vi: "Nóng bắt đầu gắt, tía tô đỏ tía trong vườn được hái muối cùng mơ — loại rau quen thuộc trên mâm cơm cả hai nước."
    ja_text: "本格的な暑さが始まるころ。梅雨明けが近づき、蝉が鳴き始めます。暑中見舞いを出すのもこのころから。"
    color_ja: "赤紫蘇の紅"
    why_ja: "本格的な暑さが始まるころ、赤紫蘇が色濃くなり、梅と一緒に漬け込まれます。日本でもベトナムでも食卓に馴染み深い葉です。"
  - ja: 大暑
    vi_text: "Nóng nhất trong năm. Người Nhật có tục ăn lươn vào một ngày giữa hè để lấy sức."
    color_vi: "Xanh mưa dông"
    why_vi: "Nóng nhất năm. Chiều nào mây cũng kéo đến rồi trút xuống một trận, trời tối lại."
    ja_text: "一年でもっとも暑さが厳しいころ。夏の土用の丑の日に、鰻を食べて精をつける習わしがあります。"
    color_ja: "雷雨の青"
    why_ja: "いちばん暑く、午後になると雲が出て一雨きます。"
  - ja: 立秋
    vi_text: "Ngày bắt đầu mùa thu theo lịch cũ, dù trời còn nóng gắt. Từ hôm nay, thiệp hỏi thăm mùa hè đổi thành thiệp hỏi thăm cái nóng còn sót lại."
    color_vi: "Xanh lơ của gió mát"
    why_vi: "Vẫn oi, nhưng gió đã khác và đêm bắt đầu dịu. Màu nhạt đi so với giữa hè."
    ja_text: "暦の上で秋が始まる日。実際には暑さの盛りですが、この日から挨拶状は「残暑見舞い」に変わります。"
    color_ja: "涼風の浅葱"
    why_ja: "まだ蒸しますが風が変わり、夜が和らぎます。"
  - ja: 処暑
    vi_text: "Cái nóng bắt đầu dịu. Chữ xử ở đây nghĩa là dừng lại: nóng đến đây là thôi. Cũng là mùa bão."
    color_vi: "Vàng lúa"
    why_vi: "Cái nóng lui dần. Đồng lúa ngả vàng, chờ gặt."
    ja_text: "暑さがようやく収まり始めるころ。「処」はとどまるという意味です。台風が多くなる時期でもあります。"
    color_ja: "稲の黄"
    why_ja: "暑さが退き、田が黄色くなって刈り入れを待ちます。"
  - ja: 白露
    vi_text: "Sáng sớm có sương đọng trắng trên cỏ. Không khí đã mang hơi thu."
    color_vi: "Xanh chuồn chuồn"
    why_vi: "Sương sớm đọng trên cỏ, chuồn chuồn bay thấp là điềm báo mưa — câu ca dao trẻ con Việt Nam nào cũng thuộc."
    ja_text: "朝晩の冷え込みで、草花に白い露が宿り始めるころ。秋の気配が深まります。"
    color_ja: "蜻蛉の青"
    why_ja: "朝露が草に宿るころ、蜻蛉が低く飛ぶと雨の前触れ。ベトナムでは子どもの誰もが知る言い伝えです。"
  - ja: 秋分
    vi_text: "Ngày và đêm lại dài bằng nhau; từ đây đêm dài dần. Ở Nhật là ngày nghỉ lễ, giữa tuần lễ viếng mộ tổ tiên mùa thu."
    color_vi: "Tím mây thu"
    why_vi: "Lại một ngày dài bằng đêm; mây chiều mùa thu mỏng và cao hơn mùa hè, ánh lên một sắc tím nhạt lúc hoàng hôn."
    ja_text: "昼と夜の長さがほぼ等しくなる日。この日を境に夜が長くなっていきます。秋のお彼岸の中日で、国民の祝日です。"
    color_ja: "秋雲の紫"
    why_ja: "また昼と夜が等しくなる日。秋の雲は夏よりも高く薄く、夕暮れには淡い紫に色づきます。"
  - ja: 寒露
    vi_text: "Sương đêm đã lạnh. Trời thu cao và trong, những ngày nắng ráo nối nhau."
    color_vi: "Vàng lục lá bạch quả"
    why_vi: "Sương lạnh hơn, trời quang; hàng bạch quả bắt đầu ngả từ xanh sang vàng, loại cây quen thuộc trong y học cổ truyền cả hai nước."
    ja_text: "露が冷たく感じられるころ。空気が澄み、秋晴れの日が続きます。"
    color_ja: "銀杏の黄緑"
    why_ja: "露が冷たく感じられ、空気が澄むころ。銀杏の葉が緑から黄緑へ色を変え始めます。"
  - ja: 霜降
    vi_text: "Sương muối bắt đầu xuống. Trên núi, lá phong đổi màu đẹp nhất."
    color_vi: "Đỏ lá phong"
    why_vi: "Sương bắt đầu thành giá. Lá phong đỏ rực một đợt rồi rụng."
    ja_text: "霜が降り始めるころ。山々では紅葉が見ごろを迎えます。"
    color_ja: "紅葉の赤"
    why_ja: "露が霜に変わり、楓が赤くなって散ります。"
  - ja: 立冬
    vi_text: "Ngày bắt đầu mùa đông theo lịch cũ. Gió lạnh đầu mùa thổi, lá cây rụng dần."
    color_vi: "Đỏ mào hạc"
    why_vi: "Gió lạnh đầu mùa thổi tới; hạc — biểu tượng trường thọ quen thuộc ở cả đình chùa Việt Nam lẫn tranh Nhật Bản — càng nổi bật giữa trời đông."
    ja_text: "暦の上で冬が始まる日。木枯らしが吹き、木々の葉が落ち始めます。"
    color_ja: "丹頂の紅"
    why_ja: "木枯らしが吹き始めるころ。長寿の象徴とされる鶴の紅い頭が、冬の空気の中で際立ちます。"
  - ja: 小雪
    vi_text: "Tuyết nhẹ bắt đầu rơi ở vùng núi và miền bắc. Trong phố, hàng bạch quả vàng rực."
    color_vi: "Nâu đồng cỏ khô"
    why_vi: "Tuyết mới lác đác. Đồng đã úa thành một màu nâu xám, không còn màu nào tươi."
    ja_text: "北国や山では、わずかに雪が降り始めるころ。街では銀杏並木が色づきます。"
    color_ja: "枯野の茶"
    why_ja: "雪はまだ少しで、野は枯れて茶鼠になります。"
  - ja: 大雪
    vi_text: "Núi phủ tuyết dày, đồng bằng cũng bắt đầu có tuyết. Mùa đông thật sự đến."
    color_vi: "Xanh lam của tuyết"
    why_vi: "Tuyết xuống dày. Màu này lấy từ bóng đổ trên tuyết, ngả xanh chứ không trắng."
    ja_text: "山々が雪に覆われ、平地でも雪が降り始めるころ。本格的な冬の到来です。"
    color_ja: "雪の青"
    why_ja: "雪が積もり、雪の影は白ではなく青に見えます。"
  - ja: 冬至
    vi_text: "Ngày ngắn nhất trong năm. Người Nhật tắm bồn thả quả yuzu và ăn bí đỏ, cầu một mùa đông khoẻ mạnh."
    color_vi: "Vàng lục vỏ bí đỏ"
    why_vi: "Đêm dài nhất năm, người Nhật ăn bí đỏ cầu sức khoẻ — loại quả cũng quen thuộc trong gian bếp Việt Nam."
    ja_text: "一年でもっとも昼が短い日。柚子湯に入り、かぼちゃを食べて、無病息災を願います。"
    color_ja: "南瓜の黄緑"
    why_ja: "一年でもっとも夜が長い日、かぼちゃを食べて無病息災を願います。ベトナムの台所にも馴染み深い実りです。"
  - ja: 小寒
    vi_text: "Bước vào những ngày lạnh nhất trong năm. Người Nhật gửi thiệp hỏi thăm giữa mùa lạnh từ đây."
    color_vi: "Xanh rau cần"
    why_vi: "Rét bắt đầu ngấm. Rau cần vẫn mọc tốt dưới nước lạnh, xanh giữa mùa không còn gì xanh."
    ja_text: "寒さが本格的になる「寒の入り」。この日から節分までを「寒の内」といい、寒中見舞いを出す時期です。"
    color_ja: "芹の緑"
    why_ja: "寒が入っても、冷たい水のなかで芹はよく育ちます。"
  - ja: 大寒
    vi_text: "Lạnh nhất trong năm. Nước lúc này được cho là khó hỏng, nên người ta dùng để ủ tương miso và nấu rượu."
    color_vi: "Vàng ngả xanh của ngồng fuki"
    why_vi: "Rét nhất năm, vậy mà ngồng fuki đã nhú lên khỏi tuyết — dấu đầu tiên của xuân."
    ja_text: "一年でもっとも寒さが厳しいころ。寒の水は腐りにくいとされ、味噌や酒の仕込みに使われてきました。"
    color_ja: "蕗の薹の黄緑"
    why_ja: "いちばん寒い頃ですが、蕗の薹が雪を押しのけて出ます。"
