# Toàn bộ chữ của 24 tiết khí, gom một chỗ để sửa một lượt. Sửa trong CMS →
# Dữ liệu → 24 tiết khí, hoặc sửa tay file này.
#
#   vi_text / ja_text   lời giải thích, hiện trong khung nhỏ khi rê chuột
#                       (điện thoại: chạm) vào tên tiết khí dưới ngày đăng bài
#   color_vi / color_ja tên màu nhấn của tiết đó
#   why_vi / why_ja     một câu nói vì sao tiết này mang màu đó
#
# Tên màu và câu "vì sao" hiện ở trang Về blog này, mục "Màu của tiết khí".
# Trang tiếng Việt chỉ dùng bản _vi, trang tiếng Nhật chỉ dùng bản _ja.
#
# Trường "ja" là tên chữ Hán, dùng để nối với ngày và mã màu trong
# data/sekki.toml: không sửa trường này.
sekki:
  - ja: 立春
    vi_text: "Ngày bắt đầu mùa xuân theo lịch cũ. Trời còn lạnh, nhưng nắng đã dài hơn và hoa mơ bắt đầu nở."
    color_vi: "Hồng hoa mơ"
    why_vi: "Trời còn rét, nhưng hoa mơ đã nở trước mọi loài hoa khác; sắc hồng ấy là lời báo đầu tiên của mùa xuân."
    ja_text: "暦の上で春が始まる日。寒さはまだ厳しいものの、日差しが少しずつ明るくなり、梅がほころび始めます。"
    color_ja: "紅梅の紅"
    why_ja: "寒さのただ中で、梅はどの花よりも早くほころびます。その紅が春の最初の知らせです。"
  - ja: 雨水
    vi_text: "Tuyết chuyển thành mưa, băng tuyết tan thành nước. Xưa kia là mốc để bắt đầu chuẩn bị việc đồng áng."
    color_vi: "Hồng xám của sương"
    why_vi: "Tuyết chuyển thành mưa, chân trời lúc nào cũng có một dải mù giăng ngang: hồng rất nhạt, pha xám và ẩm."
    ja_text: "雪が雨に変わり、積もった雪や氷が解けて水になるころ。農作業の準備を始める目安とされてきました。"
    color_ja: "霞の淡紅鼠"
    why_ja: "雪が雨に変わり、遠くにいつも霞がかかります。紅をほんの少し含んだ、湿った鼠色です。"
  - ja: 啓蟄
    vi_text: "Sâu bọ ngủ đông dưới đất tỉnh dậy, chui lên đón hơi ấm. Kinh trập nghĩa là sâu bọ đang ngủ đông giật mình thức giấc."
    color_vi: "Hồng hoa đào"
    why_vi: "Sâu bọ dưới đất vừa tỉnh thì trên cành hoa đào đã nở: ở Nhật là tết búp bê mồng ba tháng Ba, ở Việt Nam đào vẫn còn sót lại từ Tết."
    ja_text: "冬ごもりしていた虫たちが、土の中から這い出てくるころ。「啓」は開くという意味、「蟄」は土の中で冬を越す虫のことです。"
    color_ja: "桃の花の紅"
    why_ja: "土の虫が目覚めるころ、枝では桃が咲いています。日本では三月三日の桃の節句、ベトナムでも旧正月の桃がまだ残っています。"
  - ja: 春分
    vi_text: "Ngày và đêm dài gần bằng nhau. Ở Nhật là ngày nghỉ lễ, rơi vào giữa tuần lễ viếng mộ tổ tiên mùa xuân."
    color_vi: "Hồng hoa anh đào"
    why_vi: "Ngày dài bằng đêm, cũng là lúc anh đào bắt đầu nở. Hồng nhạt đến mức nhìn từ xa chỉ thấy một vầng sáng."
    ja_text: "昼と夜の長さがほぼ等しくなる日。国民の祝日で、春のお彼岸の中日にあたります。"
    color_ja: "桜の淡紅"
    why_ja: "昼と夜が等しくなるころ、桜がほころび始めます。遠くから見ると、ほのかな明かりのような淡さです。"
  - ja: 清明
    vi_text: "Trời trong, cây cỏ tươi sáng, hoa anh đào nở rộ. Ở Việt Nam là dịp tảo mộ."
    color_vi: "Xanh lá non"
    why_vi: "Hoa rụng, lá mới bật ra. Xanh còn nhạt và trong, chưa dày như lá mùa hè."
    ja_text: "「清浄明潔」を略した言葉で、万物が清らかで生き生きとするころ。桜が見ごろを迎えます。"
    color_ja: "若葉の緑"
    why_ja: "花が散り、新しい葉が開きます。夏の葉のような厚みはまだなく、淡く澄んだ緑です。"
  - ja: 穀雨
    vi_text: "Mưa xuân thấm đất, nuôi hạt giống vừa gieo. Tiết cuối cùng của mùa xuân."
    color_vi: "Xanh trà mới hái"
    why_vi: "Mưa xuân thấm đất là lúc hái lứa trà đầu năm. Cả người Nhật lẫn người Việt đều quý nước trà đầu vụ ấy nhất."
    ja_text: "穀物を潤す春の雨が降るころ。春の最後の節気で、種まきの目安とされてきました。"
    color_ja: "新茶の緑"
    why_ja: "春の雨が畑を潤すころ、その年の最初の茶を摘みます。日本でもベトナムでも、一番茶がいちばん尊ばれます。"
  - ja: 立夏
    vi_text: "Ngày bắt đầu mùa hè theo lịch cũ. Lá non xanh, gió nhẹ, là tiết trời dễ chịu nhất trong năm."
    color_vi: "Đỏ cờ cá chép"
    why_vi: "Mùng năm tháng Năm, cờ cá chép đỏ bay trên nóc nhà. Chuyện cá chép vượt vũ môn quen thuộc ở cả hai nước."
    ja_text: "暦の上で夏が始まる日。新緑がまぶしく、さわやかな風が吹く、一年でいちばん過ごしやすいころ。"
    color_ja: "鯉のぼりの緋"
    why_ja: "五月五日、緋色の鯉のぼりが空を泳ぎます。鯉が滝をのぼる話は、日本でもベトナムでも語り継がれてきました。"
  - ja: 小満
    vi_text: "Cây cỏ lớn dần, muôn vật dần đầy đặn. Lúa mạch gieo từ mùa thu bắt đầu chín."
    color_vi: "Vàng lúa mạch chín"
    why_vi: "Lúa mạch gieo từ mùa thu nay chín rộ. Người Nhật gọi thẳng quãng này là mùa gặt của lúa mạch."
    ja_text: "草木が育ち、天地に生気が少しずつ満ちてくるころ。秋にまいた麦の穂が実り始めます。"
    color_ja: "麦の秋の黄金"
    why_ja: "秋にまいた麦が実るころ。この時期をそのまま「麦秋」と呼びます。"
  - ja: 芒種
    vi_text: "Mùa gieo các loại hạt có râu như lúa. Ở Nhật, mùa mưa đầu hè bắt đầu vào khoảng này."
    color_vi: "Vàng quả mơ chín"
    why_vi: "Mùa mưa đầu hè cũng là mùa mơ chín rụng đầy gốc. Tháng Sáu, gian bếp Nhật thơm mùi mơ muối."
    ja_text: "稲や麦など、穂先に芒（のぎ）のある穀物の種をまくころ。梅雨入りもこのころです。"
    color_ja: "梅の実の黄"
    why_ja: "梅雨に入るころ、梅が黄ばんで落ちます。六月の台所は梅仕事の香りでいっぱいになります。"
  - ja: 夏至
    vi_text: "Ngày dài nhất, đêm ngắn nhất trong năm. Ở Nhật lúc này đang giữa mùa mưa, nên ít khi thấy được nắng dài."
    color_vi: "Cam ráng chiều"
    why_vi: "Ngày dài nhất năm. Đang giữa mùa mưa, nhưng hôm nào tạnh thì ráng đỏ còn nấn ná trên trời đến gần tám giờ tối."
    ja_text: "一年でもっとも昼が長く、夜が短い日。ただ日本では梅雨のさなかで、長い日差しを感じにくい時期です。"
    color_ja: "夕焼けの橙"
    why_ja: "一年でもっとも昼が長い日。梅雨の最中でも、晴れた日の夕焼けは八時近くまで空に残ります。"
  - ja: 小暑
    vi_text: "Cái nóng bắt đầu. Mùa mưa sắp dứt, ve bắt đầu kêu. Người Nhật bắt đầu gửi thiệp hỏi thăm mùa hè từ đây."
    color_vi: "Đỏ tía tô"
    why_vi: "Nóng bắt đầu gắt, tía tô trong vườn thẫm lại, được hái muối cùng mơ. Loại rau quen trên mâm cơm cả hai nước."
    ja_text: "本格的な暑さが始まるころ。梅雨明けが近づき、蝉が鳴き始めます。暑中見舞いを出すのもこのころから。"
    color_ja: "赤紫蘇の紅"
    why_ja: "暑さが本格的になり、赤紫蘇が色濃くなって、梅と一緒に漬け込まれます。日本でもベトナムでも食卓に馴染みの葉です。"
  - ja: 大暑
    vi_text: "Nóng nhất trong năm. Người Nhật có tục ăn lươn vào một ngày giữa hè để lấy sức."
    color_vi: "Đỏ trời nắng lửa"
    why_vi: "Nóng nhất trong năm. Mặt đường hầm hập, ve kêu inh; nhìn ra ngoài thấy nắng đỏ lên chứ không còn vàng."
    ja_text: "一年でもっとも暑さが厳しいころ。夏の土用の丑の日に、鰻を食べて精をつける習わしがあります。"
    color_ja: "炎天の赤"
    why_ja: "一年でもっとも暑いころ。照り返しと蝉の声のなか、日差しは黄色というより赤く見えます。"
  - ja: 立秋
    vi_text: "Ngày bắt đầu mùa thu theo lịch cũ, dù trời còn nóng gắt. Từ hôm nay, thiệp hỏi thăm mùa hè đổi thành thiệp hỏi thăm cái nóng còn sót lại."
    color_vi: "Cam đèn hoa đăng"
    why_vi: "Rơi vào rằm tháng Bảy: người Nhật đón Obon, người Việt làm Vu Lan, cùng thả đèn xuống sông tiễn người đã khuất."
    ja_text: "暦の上で秋が始まる日。実際には暑さの盛りですが、この日から挨拶状は「残暑見舞い」に変わります。"
    color_ja: "灯籠の橙"
    why_ja: "旧暦七月の満月のころ。日本ではお盆、ベトナムではヴーランにあたり、どちらも灯籠を流して亡き人を送ります。"
  - ja: 処暑
    vi_text: "Cái nóng bắt đầu dịu. Chữ xử ở đây nghĩa là dừng lại: nóng đến đây là thôi. Cũng là mùa bão."
    color_vi: "Vàng lúa chín"
    why_vi: "Cái nóng lui dần, đồng lúa ngả vàng chờ gặt — màu quen thuộc ở đồng bằng cả hai nước."
    ja_text: "暑さがようやく収まり始めるころ。「処」はとどまるという意味です。台風が多くなる時期でもあります。"
    color_ja: "稲の黄金"
    why_ja: "暑さが退き、田が黄金色になって刈り入れを待ちます。日本でもベトナムでも見慣れた景色です。"
  - ja: 白露
    vi_text: "Sáng sớm có sương đọng trắng trên cỏ. Không khí đã mang hơi thu."
    color_vi: "Bạc cỏ lau"
    why_vi: "Sương sớm đọng trắng trên cỏ. Bông lau trổ, phơi một màu bạc ngả nâu, gần như đã nhạt hết sắc."
    ja_text: "朝晩の冷え込みで、草花に白い露が宿り始めるころ。秋の気配が深まります。"
    color_ja: "芒の白茶"
    why_ja: "朝露が草に白く宿るころ。芒の穂が開き、色を失いかけた白茶色になります。"
  - ja: 秋分
    vi_text: "Ngày và đêm lại dài bằng nhau; từ đây đêm dài dần. Ở Nhật là ngày nghỉ lễ, giữa tuần lễ viếng mộ tổ tiên mùa thu."
    color_vi: "Đỏ hoa bỉ ngạn"
    why_vi: "Tuần lễ viếng mộ mùa thu. Hoa bỉ ngạn đỏ nở dọc bờ ruộng đúng mấy ngày ấy, năm nào cũng không sai."
    ja_text: "昼と夜の長さがほぼ等しくなる日。この日を境に夜が長くなっていきます。秋のお彼岸の中日で、国民の祝日です。"
    color_ja: "彼岸花の紅"
    why_ja: "秋のお彼岸のころ。畦道に彼岸花が咲き、毎年この数日を違えることがありません。"
  - ja: 寒露
    vi_text: "Sương đêm đã lạnh. Trời thu cao và trong, những ngày nắng ráo nối nhau."
    color_vi: "Vàng lá bạch quả"
    why_vi: "Sương đã lạnh, trời thu cao và trong; hàng bạch quả bắt đầu ngả từ xanh sang vàng."
    ja_text: "露が冷たく感じられるころ。空気が澄み、秋晴れの日が続きます。"
    color_ja: "銀杏の黄"
    why_ja: "露が冷たくなり、空気が澄むころ。銀杏並木が緑から黄へ移り始めます。"
  - ja: 霜降
    vi_text: "Sương muối bắt đầu xuống. Trên núi, lá phong đổi màu đẹp nhất."
    color_vi: "Đỏ lá phong"
    why_vi: "Sương bắt đầu thành giá. Trên núi, lá phong đỏ rực lên một đợt rồi rụng hết."
    ja_text: "霜が降り始めるころ。山々では紅葉が見ごろを迎えます。"
    color_ja: "紅葉の赤"
    why_ja: "露が霜に変わるころ。山では楓がひとしきり赤く燃えて、散ってゆきます。"
  - ja: 立冬
    vi_text: "Ngày bắt đầu mùa đông theo lịch cũ. Gió lạnh đầu mùa thổi, lá cây rụng dần."
    color_vi: "Xám tím gió bấc"
    why_vi: "Cơn gió lạnh đầu mùa thổi qua, vét nốt lá trên cành. Trời tối sớm, ngả sang một màu xám pha tím."
    ja_text: "暦の上で冬が始まる日。木枯らしが吹き、木々の葉が落ち始めます。"
    color_ja: "木枯らしの藍鼠"
    why_ja: "最初の冷たい風が吹き、残った葉を落としてゆきます。日暮れが早まり、空は紫を帯びた鼠色になります。"
  - ja: 小雪
    vi_text: "Tuyết nhẹ bắt đầu rơi ở vùng núi và miền bắc. Trong phố, hàng bạch quả vàng rực."
    color_vi: "Xám tuyết đầu mùa"
    why_vi: "Tuyết mới lác đác trên núi, chưa kịp đọng. Dưới trời mây, tuyết không trắng mà là một màu xám lạnh, gần như không còn sắc."
    ja_text: "北国や山では、わずかに雪が降り始めるころ。街では銀杏並木が色づきます。"
    color_ja: "初雪の白鼠"
    why_ja: "山にわずかな雪が舞い、まだ積もりません。曇り空の下の雪は、色を失った冷たい鼠色に見えます。"
  - ja: 大雪
    vi_text: "Núi phủ tuyết dày, đồng bằng cũng bắt đầu có tuyết. Mùa đông thật sự đến."
    color_vi: "Xanh chàm bóng tuyết"
    why_vi: "Tuyết xuống dày. Màu này lấy từ bóng đổ trên mặt tuyết — nhìn kỹ thì bóng ấy xanh chứ không xám."
    ja_text: "山々が雪に覆われ、平地でも雪が降り始めるころ。本格的な冬の到来です。"
    color_ja: "雪の影の藍"
    why_ja: "雪が積もるころ。雪の上に落ちた影は、よく見ると灰色ではなく青く沈んでいます。"
  - ja: 冬至
    vi_text: "Ngày ngắn nhất trong năm. Người Nhật tắm bồn thả quả yuzu và ăn bí đỏ, cầu một mùa đông khoẻ mạnh."
    color_vi: "Chàm ngân hà mùa đông"
    why_vi: "Đêm dài nhất năm cũng là đêm trời sáng sao nhất. Màu này lấy từ nền trời quanh dải ngân hà mùa đông — chàm sẫm, lạnh, chưa tới đen."
    ja_text: "一年でもっとも昼が短い日。柚子湯に入り、かぼちゃを食べて、無病息災を願います。"
    color_ja: "冬銀河の藍"
    why_ja: "一年でもっとも夜が長い日は、星がもっとも冴える夜でもあります。冬の銀河がかかる空の、黒には至らない深い藍から。"
  - ja: 小寒
    vi_text: "Bước vào những ngày lạnh nhất trong năm. Người Nhật gửi thiệp hỏi thăm giữa mùa lạnh từ đây."
    color_vi: "Xanh băng"
    why_vi: "Bước vào những ngày lạnh nhất. Chậu nước để ngoài trời qua một đêm là thành băng, trong và ngả xanh."
    ja_text: "寒さが本格的になる「寒の入り」。この日から節分までを「寒の内」といい、寒中見舞いを出す時期です。"
    color_ja: "氷の青"
    why_ja: "寒の入り。外に置いた水は一晩で凍り、澄んだ青を帯びます。"
  - ja: 大寒
    vi_text: "Lạnh nhất trong năm. Nước lúc này được cho là khó hỏng, nên người ta dùng để ủ tương miso và nấu rượu."
    color_vi: "Xanh trời rét cóng"
    why_vi: "Lạnh nhất trong năm. Mà hôm rét nhất lại là hôm trời trong nhất: một màu xanh cứng, không một gợn mây."
    ja_text: "一年でもっとも寒さが厳しいころ。寒の水は腐りにくいとされ、味噌や酒の仕込みに使われてきました。"
    color_ja: "凍空の青"
    why_ja: "一年でもっとも寒いころ。いちばん冷える日の空は、雲ひとつない硬い青になります。"
