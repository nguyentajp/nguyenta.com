# 七十二候 — bảy mươi hai hậu, dữ liệu cho dòng mùa ở chân trang.
#
# Mỗi tiết khí (data/sekki.toml) chia làm ba hậu, mỗi hậu chừng năm ngày:
# part = 1 tính từ ngày đầu tiết, part = 2 sau đó năm ngày, part = 3 sau mười
# ngày. Layout tính bằng mốc của tiết cộng số ngày, nên ở đây không cần ghi
# ngày; xem _partials/kou.html.
#
# Đây là bộ 本朝七十二候 (lịch Nhật 1874), không phải bộ Trung Hoa, nên tên có
# chỗ khác với bảng hay gặp trong tiếng Việt.
#
# ja là chữ Hán, kana là cách đọc — chỉ hiện ở trang tiếng Nhật. vi là câu
# tiếng Việt, một câu tả một chuyển động của trời đất; trang tiếng Việt chỉ
# hiện câu này, không hiện chữ Hán.

